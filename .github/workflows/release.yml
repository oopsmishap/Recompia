# release -> windows, linux, macos -> publish. The first job creates the GitHub release (title and notes from the tag's section
# of CHANGELOG.md), the three platform jobs build their package and upload it into that release, and publish writes one
# SHA256SUMS.txt over all three archives. A tag v<x.y.z> does this; a manual run without release_tag only builds (artifacts).
# Manual runs with release_tag = v<x.y.z> publish the same way and GitHub creates the tag on the commit that was built. No test
# or pull request checks.
# Testing channel: a tag v<x.y.z>-alpha.N, -beta.N or -rc.N (run on the `testing` branch) publishes a GitHub PRERELEASE. The launcher's
# Stable channel never offers it; players who chose Testing do. Its notes come from its own CHANGELOG section if there is one, else from
# the Unreleased section, else a short generic text.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish as this release (v<x.y.z> from main; v<x.y.z>-beta.N, -alpha.N or -rc.N, a Testing prerelease, from the testing branch; GitHub creates the tag). Empty: build only.'
        required: false
        default: ''

permissions:
  contents: write

# One release per ref: a re-push or a manual dispatch cancels the run it replaces instead of queueing a second one behind it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_VERSION: 23.1.4
  RYUBING_COMMIT: a82350bb774f70fcbd41c9987bf67a3775409963
  # package the third-party payload comes from (make-release.ps1): the upstream v0.1.1 repository is gone, so our own last release
  BASE_REPO: Dittobyte/Recompia
  BASE_RELEASE: v0.8.2
  # the release this run publishes: the pushed tag, or a manual run's release_tag; empty = build only
  REL_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}

jobs:
  # The release itself, before anything is built: the title and the notes come from CHANGELOG.md, and the three platform
  # jobs only upload their archive into a release that already exists. Nothing has to wait for another job's release, and
  # no two jobs can create one.
  release:
    # A few seconds of work (parse CHANGELOG.md, one gh call): a Linux runner starts sooner and costs half a Windows one.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          if [ -n "$REL_TAG" ] && [ "$GITHUB_REF_TYPE" != tag ]; then
            if printf '%s' "$REL_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$'; then
              [ "$GITHUB_REF" = refs/heads/testing ] || { echo "::error::a Testing release_tag publishes from the testing branch only (this run: $GITHUB_REF)"; exit 1; }
            else
              [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::release_tag publishes from main only (this run: $GITHUB_REF)"; exit 1; }
              printf '%s' "$REL_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::release_tag '$REL_TAG' is not v<x.y.z> or v<x.y.z>-beta.N"; exit 1; }
            fi
          fi
          v=${REL_TAG#v}; v=${v:-0.0.0}
          echo "VERSION=$v" >> "$GITHUB_ENV"
          case "$v" in *-*) echo "PRERELEASE=true" >> "$GITHUB_ENV" ;; *) echo "PRERELEASE=false" >> "$GITHUB_ENV" ;; esac

      - name: Create the release
        if: env.REL_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # the version's own section of CHANGELOG.md; a Testing build may have none and falls back to Unreleased
          notes=$(awk -v v="$VERSION" '
            { sub(/\r$/, "") }
            $0 ~ "^## " v "([ \t(]|$)" {inside=1; next}
            inside && /^## / {exit}
            inside {print}
          ' CHANGELOG.md)
          if [ -z "${notes//[[:space:]]/}" ] && [ "$PRERELEASE" = true ]; then
            notes=$(awk '{ sub(/\r$/, "") } $0 ~ "^## Unreleased" {inside=1; next} inside && /^## / {exit} inside {print}' CHANGELOG.md)
          fi
          if [ -z "${notes//[[:space:]]/}" ]; then
            if [ "$PRERELEASE" = true ]; then
              notes="A Testing build: newer than the latest stable release and less tested. Please report problems on GitHub with pkp.log and say you were on Testing."
            else
              echo "::error::CHANGELOG.md has no section '## $VERSION'"; exit 1
            fi
          fi
          printf '%s\n' "$notes" > build-notes.md
          if [ "$PRERELEASE" = true ]; then
            # what was merged since the previous release; a failure here never blocks the release
            if prev=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null) && [ -n "$prev" ]; then
              { git fetch --quiet --unshallow origin 2>/dev/null || true; git fetch --quiet origin "+refs/tags/$prev:refs/tags/$prev" 2>/dev/null || true; } || true
              changes=$(git log --merges --format='%H' "$prev..HEAD" 2>/dev/null | while read -r h; do
                subject=$(git show -s --format='%s' "$h")
                title=$(git show -s --format='%b' "$h" | awk 'NF{print; exit}')
                n=$(printf '%s' "$subject" | grep -oE '#[0-9]+' | head -1 | tr -d '#')
                [ -n "$n" ] && [ -n "$title" ] && echo "- #$n $title"
              done || true)
              if [ -n "$changes" ]; then
                { echo "### Changes in this build"; printf '%s\n\n' "$changes"; cat build-notes.md; } > build-notes.new
                mv build-notes.new build-notes.md
              fi
            fi
            printf '\n\n### How to report\nOpen [a bug report](https://github.com/featureJosh/pokopia-recomp/issues/new?template=bug_report.yml), choose **Testing** as the channel, say which version you have, and attach `pkp.log` (and `setup.log` if Set up ran). Thank you for testing.\n' >> build-notes.md
          fi
          build=$(grep -m1 -E "^## ${VERSION//./\\.} \(build ([^)]+)\)" CHANGELOG.md | tr -d '\r' | sed -E 's/^## [^(]*\(build ([^)]+)\).*/\1/' || true)
          title="Pokopia Recomp $VERSION"
          if [ -n "$build" ]; then title="$title (build $build)"; elif [ "$PRERELEASE" = true ]; then title="$title (Testing)"; fi
          args=()
          [ "$PRERELEASE" = true ] && args+=(--prerelease)
          gh release create "$REL_TAG" --target "$GITHUB_SHA" --title "$title" --notes-file build-notes.md "${args[@]}"

  # The Windows package. Every job below uploads its own archive into the release the job above created; the checksum file
  # is written once, by publish, after all three are in.
  windows:
    needs: release
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          if ($env:REL_TAG -and $env:GITHUB_REF_TYPE -ne 'tag') {
            if ($env:REL_TAG -match '^v\d+\.\d+\.\d+-(alpha|beta|rc)\.\d+$') {
              if ($env:GITHUB_REF -ne 'refs/heads/testing') { throw "a Testing release_tag publishes from the testing branch only (this run: $env:GITHUB_REF)" }
            } else {
              if ($env:GITHUB_REF -ne 'refs/heads/main') { throw "release_tag publishes from main only (this run: $env:GITHUB_REF)" }
              if ($env:REL_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "release_tag '$env:REL_TAG' is not v<x.y.z> or v<x.y.z>-beta.N" }
            }
          }
          $v = if ($env:REL_TAG) { $env:REL_TAG -replace '^v', '' } else { '0.0.0' }
          "VERSION=$v" >> $env:GITHUB_ENV
          "PRERELEASE=$(if ($v -match '-') { 'true' } else { 'false' })" >> $env:GITHUB_ENV

      # The launcher is a Tauri app: its dependency tree is most of the build time, and Cargo.lock changes rarely.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri

      # The pinned third-party archives (SDL3, zstd, Vulkan-Headers, volk, VMA, ImGui): CMake reuses a file whose SHA-256
      # matches, so a hit skips the downloads entirely.
      - name: Third-party sources cache
        uses: actions/cache@v4
        with:
          path: build/deps
          key: nxrt-deps-win-v1

      - name: LLVM ${{ env.LLVM_VERSION }}
        run: |
          $msi = "$env:RUNNER_TEMP\llvm.msi"
          Invoke-WebRequest "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/LLVM-$env:LLVM_VERSION-win64.msi" -OutFile $msi -MaximumRetryCount 5 -RetryIntervalSec 30   # GitHub answers this large download with a 504 now and then
          Start-Process msiexec -Wait -ArgumentList '/i', $msi, '/qn'
          & 'C:\Program Files\LLVM\bin\clang-cl.exe' --version
          'C:\Program Files\LLVM\bin' >> $env:GITHUB_PATH

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Ninja
        run: choco install ninja -y --no-progress

      - name: libvpx cache
        id: vpx
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-libvpx-x64-windows-static-v1

      - name: libvpx
        if: steps.vpx.outputs.cache-hit != 'true'
        run: C:\vcpkg\vcpkg.exe install libvpx:x64-windows-static

      - name: Texture tools (astc2bc7, astcdec DLLs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./tools/textures/scripts/fetch_third_party.ps1
          ./tools/textures/scripts/build.ps1

      # github.com's direct release-asset downloads answered 504 for hours on 2026-11-08 while the release API kept working. CMake's FetchContent
      # reuses a file in NXRT_DEPS_DIR (%LOCALAPPDATA%\nxrt\deps) when its SHA-256 matches, so the two release assets are put there first through the API.
      # A failure here is not fatal: CMake then downloads them itself, as before.
      - name: Pre-fetch release assets (API route)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $d = Join-Path $env:GITHUB_WORKSPACE 'build\deps'
          New-Item -ItemType Directory -Force $d | Out-Null
          gh release download release-3.4.18 -R libsdl-org/SDL -p SDL3-3.4.18.tar.gz -D $d --clobber
          if ($LASTEXITCODE) { Write-Warning 'SDL3 pre-fetch failed; CMake will download it' }
          gh release download v1.5.7 -R facebook/zstd -p zstd-1.5.7.tar.gz -D $d --clobber
          if ($LASTEXITCODE) { Write-Warning 'zstd pre-fetch failed; CMake will download it' }
          exit 0

      # The four archive dependencies (runtime/cmake/gfx_deps.cmake) come from codeload.github.com, which kept working while github.com/.../archive
      # answered 503 on 2026-11-08. Each is checked against the same SHA-256 that CMake pins, extracted, and handed to CMake as its source
      # (FETCHCONTENT_SOURCE_DIR_*). Any problem here leaves that dependency to CMake's own download, as before.
      - name: Pre-fetch dependency sources (codeload)
        run: |
          $root = Join-Path $PWD 'build/depsrc'
          New-Item -ItemType Directory -Force $root | Out-Null
          $deps = @(
            @{ n = 'VULKAN_HEADERS'; u = 'https://codeload.github.com/KhronosGroup/Vulkan-Headers/zip/refs/tags/vulkan-sdk-1.4.363.0'; h = 'f4be95220ff0ee0b1c620301ff4fe9ae48592d71f4c30f2d5c571351a153ae81' },
            @{ n = 'VOLK'; u = 'https://codeload.github.com/zeux/volk/zip/refs/tags/vulkan-sdk-1.4.363.0'; h = '889b90fdcbe9cee7b118339d640c6895b7be5c920d309c44b744692063275b3d' },
            @{ n = 'VMA'; u = 'https://codeload.github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator/zip/refs/tags/v3.4.0'; h = 'ce9a61ea5e72284ac9ccc152c214eef381ab57bfd7383f20232e5a652e3afda6' },
            @{ n = 'IMGUI'; u = 'https://codeload.github.com/ocornut/imgui/zip/refs/tags/v1.92.9b'; h = 'e1c46d676c2bcb7ced847ba27f50553e33a19db97b3cadaec7f8be64449139f8' }
          )
          $dargs = @()
          foreach ($d in $deps) {
            $zip = Join-Path $root "$($d.n).zip"
            curl.exe -fL --retry 5 --retry-delay 15 --retry-all-errors -o $zip $d.u
            if ($LASTEXITCODE -ne 0) { Write-Warning "$($d.n): download failed, CMake will fetch it"; continue }
            if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $d.h) { Write-Warning "$($d.n): checksum differs, CMake will fetch it"; continue }
            $out = Join-Path $root $d.n
            Expand-Archive $zip $out -Force
            $inner = Get-ChildItem $out -Directory | Select-Object -First 1
            if (-not $inner) { Write-Warning "$($d.n): nothing extracted"; continue }
            $dargs += "-DFETCHCONTENT_SOURCE_DIR_$($d.n)=$($inner.FullName -replace '\\', '/')"
          }
          "CMAKE_DEP_ARGS=$($dargs -join ' ')" >> $env:GITHUB_ENV
          Write-Output "dependency overrides: $($dargs.Count) of $($deps.Count)"
          exit 0

      - name: pkp_rt.dll
        run: |
          $depArgs = @()
          if ($env:CMAKE_DEP_ARGS) { $depArgs = @($env:CMAKE_DEP_ARGS -split ' ' | Where-Object { $_ }) }
          cmake -S game-build -B build/rtdll -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl `
                -DPKP_RT_DLL=ON -DPKP_RELEASE=ON "-DPKP_VERSION=$env:VERSION" `
                "-DNXRT_DEPS_DIR=$env:GITHUB_WORKSPACE\build\deps" @depArgs
          if ($LASTEXITCODE) { exit 1 }
          cmake --build build/rtdll --target pkp_rt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Launcher
        working-directory: launcher
        run: |
          if ($env:REL_TAG) {   # the launcher window shows its own version
            $c = 'src-tauri/tauri.conf.json'; (Get-Content -Raw $c) -replace '"version": "[^"]*"', "`"version`": `"$env:VERSION`"" | Set-Content -NoNewline $c
            $t = 'src-tauri/Cargo.toml'; (Get-Content -Raw $t) -replace '(?m)^version = "[^"]*"', "version = `"$env:VERSION`"" | Set-Content -NoNewline $t
          }
          if ($env:GITHUB_REF -eq 'refs/heads/testing') {   # a Testing build has its own icon (the Stable icons stay in the repository untouched)
            Copy-Item -Force src-tauri/icons-testing/* src-tauri/icons/
          }
          npm ci
          # the Settings page against the runtime's schemas: among others every gameplay mod on by default (the runtime's own table is
          # held to that by PKP_GAMEPLAY_DEFAULTS_CHECK in the pkp_rt.dll step), so a test build's default cannot ship
          node scripts/test-settings-schema.mjs
          if ($LASTEXITCODE) { exit 1 }
          npm run tauri build
          if ($LASTEXITCODE) { exit 1 }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Ryujinx sources cache
        uses: actions/cache@v4
        with:
          path: refs/ryubing
          key: ryujinx-${{ env.RYUBING_COMMIT }}

      - name: Shader translator
        run: |
          [ -d refs/ryubing/.git ] || git clone --filter=blob:none https://git.ryujinx.app/ryubing/ryujinx.git refs/ryubing
          git -C refs/ryubing checkout -f $env:RYUBING_COMMIT
          ./tools/shaders/scripts/setup_ryujinx.ps1
          dotnet publish -c Release -r win-x64 --self-contained true tools/shaders/harness/SpirvHarness.csproj -o build/harness
          if ($LASTEXITCODE) { exit 1 }

      - name: Package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:BASE_RELEASE -R $env:BASE_REPO -p '*-win64.zip' -D build/base
          ./game-build/scripts/make-release.ps1 -Version $env:VERSION -Base (Get-Item build/base/*.zip).FullName -RtDir build/rtdll `
              -Launcher launcher/src-tauri/target/release/pokopia-launcher.exe -Harness build/harness -Out build/rel

      - uses: actions/upload-artifact@v4
        with:
          name: PokopiaRecomp-${{ env.VERSION }}-win64
          path: build/rel/*.zip
          compression-level: 0

      - name: Publish
        if: env.REL_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $env:REL_TAG -R $env:GITHUB_REPOSITORY (Get-Item build/rel/*.zip).FullName --clobber

  # The Linux package: built on Linux from this checkout, no Proton, no Wine and nothing taken from the Windows build. The
  # launcher is the AppImage, the runtime is libpkp_rt.so (the Linux build of the same sources), the shader translator is the
  # linux-x64 publish, and a player's Set up compiles pkp for x86_64-linux-gnu with the Zig the launcher fetches. A tag adds it
  # to the release; manual runs without release_tag only build it (artifact).
  linux:
    needs: release
    # Ubuntu 22.04: the AppImage then needs glibc 2.35 (Ubuntu 22.04, Debian 12, Mint 21, SteamOS), not 24.04's 2.39
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          if [ -n "$REL_TAG" ]; then v=${REL_TAG#v}; else v=0.0.0; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri

      - name: Third-party sources cache
        uses: actions/cache@v4
        with:
          path: build/deps
          key: nxrt-deps-linux-v1

      # 22.04 ships Python 3.10 and CMake 3.22; nxrecomp needs 3.11+ (find_package(Python3 3.11) in recomp/cmake/NxRecomp.cmake)
      # and the runtime needs CMake 3.25 (docs/linux-port.md §4).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev file \
            g++ ninja-build pkg-config libvulkan-dev libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxfixes-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libdrm-dev libudev-dev libasound2-dev \
            libpulse-dev libgbm-dev fonts-dejavu-core

      - name: CMake
        run: |
          python3 -m pip install --upgrade "cmake>=3.28" pillow
          cmake --version
          python3 --version

      - name: Runtime (libpkp_rt.so)
        run: |
          cmake -S game-build -B build/rtdll -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DPython3_EXECUTABLE="$(command -v python3)" \
                "-DNXRT_DEPS_DIR=$PWD/build/deps" \
                -DPKP_RT_DLL=ON -DPKP_RELEASE=ON "-DPKP_VERSION=$VERSION"
          cmake --build build/rtdll --target pkp_rt
          file build/rtdll/libpkp_rt.so
          # the exe resolves its exports through this list; a missing one links nothing at the player's Set up. The symbols carry
          # the version script's default version (pkp_rt_main@@PKP_RT_1), so the suffix comes off before comparing.
          nm -D --defined-only build/rtdll/libpkp_rt.so | awk '{print $NF}' | sed 's/@.*//' | sort -u > build/exports.txt
          while read -r s; do
            [ -z "$s" ] || grep -qx "${s#_}" build/exports.txt || { echo "::error::libpkp_rt.so does not export $s"; exit 1; }
          done < game-build/src/pkp_rt.exports

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Launcher (AppImage)
        working-directory: launcher
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1     # linuxdeploy is an AppImage itself; no FUSE on the runner
          NO_STRIP: true
        run: |
          if [ -n "$REL_TAG" ]; then   # the launcher window shows its own version
            sed -i -E "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
            sed -i -E "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          fi
          if [ "$GITHUB_REF" = "refs/heads/testing" ]; then   # a Testing build has its own icon (the Stable icons stay in the repository untouched)
            cp -f src-tauri/icons-testing/* src-tauri/icons/
          fi
          npm ci --no-audit --no-fund
          # linuxdeploy and its plugins are downloaded from GitHub while bundling; a failed download (HTTP 504, a missing plugin) fails the
          # job although nothing is wrong with the code (0.8.2 and beta.12). The compiled launcher is reused, so a retry only repeats the bundling.
          for try in 1 2 3; do
            if npm run tauri build -- --bundles appimage --config '{"bundle":{"active":true}}'; then break; fi
            [ "$try" = 3 ] && { echo "::error::the AppImage could not be bundled after 3 tries"; exit 1; }
            echo "::warning::AppImage bundling failed (try $try of 3), trying again in 30 s"
            rm -rf src-tauri/target/release/bundle/appimage
            sleep 30
          done
          ls -la src-tauri/target/release/bundle/appimage/

      - name: AppImage runtime without FUSE 2
        # linuxdeploy's runtime needs libfuse2, which Ubuntu 24.04 and others no longer install; the static type2 runtime
        # (pinned) needs none. The AppImage is that runtime followed by the same squashfs.
        env:
          RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
        run: |
          curl -fsSL --retry 3 -o runtime-x86_64 "$RUNTIME_URL"
          echo "$RUNTIME_SHA256  runtime-x86_64" | sha256sum -c -
          ai=$(ls launcher/src-tauri/target/release/bundle/appimage/*.AppImage)
          off=$(APPIMAGE_EXTRACT_AND_RUN=1 "$ai" --appimage-offset)
          { cat runtime-x86_64; tail -c +$((off + 1)) "$ai"; } > "$ai.new"
          chmod 755 "$ai.new" && mv "$ai.new" "$ai"
          "$ai" --appimage-offset

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Ryujinx sources cache
        uses: actions/cache@v4
        with:
          path: refs/ryubing
          key: ryujinx-${{ env.RYUBING_COMMIT }}

      - name: Shader translator
        run: |
          [ -d refs/ryubing/.git ] || git clone --filter=blob:none https://git.ryujinx.app/ryubing/ryujinx.git refs/ryubing
          git -C refs/ryubing checkout -f "$RYUBING_COMMIT"
          bash tools/shaders/scripts/setup_ryujinx.sh
          dotnet publish -c Release -r linux-x64 --self-contained true tools/shaders/harness/SpirvHarness.csproj -o build/harness
          build/harness/spirv_harness --help > /dev/null

      - name: Package
        run: |
          mkdir -p build/rel
          sh launcher/scripts/make-linux.sh build/rel "$VERSION"
          # what the launcher and Set up look for: a missing one is a broken package, not a slow one
          pkg="build/rel/PokopiaRecomp-$VERSION"
          for f in PokopiaLauncher.AppImage libpkp_rt.so README.txt tools/build/pkp_build.py tools/build/dump_hashes.json \
                   tools/build/sdk/libpkp_rt.so tools/build/sdk/pkp_stub.cpp tools/build/sdk/pkp_rt_api.h \
                   tools/build/sdk/fonts/DejaVuSans.ttf tools/build/sdk/kbm_icons tools/build/recomp/nxrecomp/__main__.py \
                   tools/harness/spirv_harness tools/shaders/extract_corpus.py assets/prompts/prompt_icons.pak; do
            test -e "$pkg/$f" || { echo "::error::missing $f in the package"; find "$pkg" -maxdepth 3 | head -40; exit 1; }
          done
          test -x "$pkg/tools/harness/spirv_harness"
          ls -la build/rel

      - name: Smoke test (the AppImage starts and finds tools/)
        run: |
          sudo apt-get install -y -q --no-install-recommends xvfb
          cd "build/rel/PokopiaRecomp-$VERSION"
          (APPIMAGE_EXTRACT_AND_RUN=1 timeout 20 xvfb-run -a ./PokopiaLauncher.AppImage > ../launch.log 2>&1; echo "exit $?" >> ../launch.log) || true
          cat ../launch.log
          grep -q "exit 124" ../launch.log || { echo "the launcher did not keep running"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: PokopiaRecomp-${{ env.VERSION }}-linux-x64
          path: build/rel/*.tar.gz
          compression-level: 0

      - name: Publish
        if: env.REL_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$REL_TAG" -R "$GITHUB_REPOSITORY" build/rel/PokopiaRecomp-$VERSION-linux-x64.tar.gz --clobber

  macos:
    needs: release
    runs-on: macos-latest          # arm64, the port's target (macos-14 was x64 and its image was retired on 2 November 2026)
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      # Developer ID signing and notarization, when the repository has the secrets (see the "Signing" step). Without them the
      # bundle keeps its ad-hoc signature and macOS blocks the first launch, which the DMG's README explains to the player.
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          if [ -n "$REL_TAG" ]; then v=${REL_TAG#v}; else v=0.0.0; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Packages
        run: |
          brew install molten-vk          # cmake and ninja come with the image
          echo "NXRT_MOLTENVK_DIR=$(brew --prefix molten-vk)/lib" >> "$GITHUB_ENV"
          python3 -m pip install --user --break-system-packages pillow   # tools/kbm_icons.py draws the prompt icons (Homebrew's python is externally managed)

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri

      - name: Third-party sources cache
        uses: actions/cache@v4
        with:
          path: work/deps
          key: nxrt-deps-macos-v1

      - name: Ryujinx sources cache
        uses: actions/cache@v4
        with:
          path: refs/ryubing
          key: ryujinx-${{ env.RYUBING_COMMIT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Runtime dylib (libpkp_rt.dylib)
        run: |
          cmake -S game-build -B work/build/rtb -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 \
                "-DNXRT_DEPS_DIR=$PWD/work/deps" \
                -DPKP_RT_DLL=ON -DNXRT_BUILD_GFX=ON -DNXRT_GAMES=pkp
          cmake --build work/build/rtb --target pkp_rt -j 4

      - name: Shader harness (self-contained osx-arm64)
        run: |
          [ -d refs/ryubing/.git ] || git clone --filter=blob:none https://git.ryujinx.app/ryubing/ryujinx.git refs/ryubing
          git -C refs/ryubing checkout -f "$RYUBING_COMMIT"
          # setup_ryujinx.ps1 stages these with robocopy, which macOS does not have
          dst=tools/shaders/third_party/ryubing
          mkdir -p "$dst/src"
          for p in Ryujinx.Common Spv.Generator Ryujinx.Graphics.Shader; do
            rsync -a --exclude obj --exclude bin "refs/ryubing/src/$p" "$dst/src/"
          done
          cp refs/ryubing/Directory.Build.props refs/ryubing/Directory.Packages.props refs/ryubing/global.json \
             refs/ryubing/nuget.config refs/ryubing/LICENSE.txt "$dst/"
          dotnet publish tools/shaders/harness -c Release -r osx-arm64 --self-contained -o work/harness

      - name: Launcher
        working-directory: launcher
        run: |
          if [ -n "$REL_TAG" ]; then   # the launcher window and the bundle show the release's version
            sed -i '' -E "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
            sed -i '' -E "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          fi
          npm ci --no-audit --no-fund
          npm run tauri build
          mkdir -p ../work/play
          cp src-tauri/target/release/pokopia-launcher ../work/play/PokopiaLauncher

      - name: Signing (Developer ID Application, notarized)
        if: env.MACOS_CERT_P12 != ''
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          printf '%s' "$MACOS_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p actions "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p actions "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -nE 's/.*"(Developer ID Application[^"]+)".*/\1/p' | head -1)
          if [ -z "$identity" ]; then
            echo "::error::MACOS_CERT_P12 holds no Developer ID Application certificate"
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.private_keys"
          printf '%s' "$NOTARY_KEY_P8" > "$HOME/.private_keys/AuthKey_$NOTARY_KEY_ID.p8"
          xcrun notarytool store-credentials recompia --key "$HOME/.private_keys/AuthKey_$NOTARY_KEY_ID.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
          echo "NOTARY_PROFILE=recompia" >> "$GITHUB_ENV"

      - name: Package (DMG)
        run: launcher/scripts/make-dmg.sh work/play "$VERSION"

      - name: Check the package
        run: |
          dmg="work/play/Recompia-$VERSION-macos-arm64.dmg"
          test -s "$dmg"
          mount=$(mktemp -d)
          hdiutil attach -quiet -nobrowse -mountpoint "$mount" "$dmg"
          app="$mount/PokopiaLauncher.app"
          test -x "$app/Contents/MacOS/PokopiaLauncher"
          file "$app/Contents/MacOS/PokopiaLauncher" | grep -q arm64
          for f in tools/build/sdk/libpkp_rt.dylib tools/build/sdk/libvulkan.1.dylib tools/build/sdk/kbm_icons \
                   tools/build/sdk/fonts tools/harness/spirv_harness tools/build/pkp_build.py; do
            test -e "$app/Contents/MacOS/$f" || { echo "missing $f in the bundle"; ls -R "$app/Contents/MacOS" | head -60; exit 1; }
          done
          codesign --verify --deep --strict "$app"
          if [ -n "${CODESIGN_IDENTITY:-}" ]; then spctl -a -vv "$app" || { echo "Gatekeeper rejects the signed bundle"; exit 1; }; fi
          hdiutil detach -quiet "$mount"
          du -h "$dmg"
          # the in-place updater's package: update.rs needs PokopiaRecomp-<version>/ with the launcher and tools/build in it
          zip="work/play/Recompia-$VERSION-macos-arm64.zip"
          test -s "$zip"
          unzip -Z1 "$zip" | grep -qx "PokopiaRecomp-$VERSION/PokopiaLauncher" || { echo "the update zip has no launcher at PokopiaRecomp-$VERSION/PokopiaLauncher"; exit 1; }
          unzip -Z1 "$zip" | grep -qx "PokopiaRecomp-$VERSION/tools/build/pkp_build.py" || { echo "the update zip has no tools/build"; exit 1; }
          du -h "$zip"

      - name: Checksums
        run: |
          cd work/play
          shasum -a 256 "Recompia-$VERSION-macos-arm64.dmg" | sed -E 's/  / */' > macos.sha256
          cat macos.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: PokopiaRecomp-${{ env.VERSION }}-macos-arm64
          path: |
            work/play/Recompia-${{ env.VERSION }}-macos-arm64.dmg
            work/play/Recompia-${{ env.VERSION }}-macos-arm64.zip
            work/play/macos.sha256
          compression-level: 0

      - name: Publish
        if: env.REL_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$REL_TAG" -R "$GITHUB_REPOSITORY" "work/play/Recompia-$VERSION-macos-arm64.dmg" "work/play/Recompia-$VERSION-macos-arm64.zip" --clobber

  # One checksum file for the whole release: the per-platform jobs upload their archives, and this reads them back once all
  # three are done, so no two jobs append to SHA256SUMS.txt at the same time.
  publish:
    needs: [windows, linux, macos]
    if: always() && (github.ref_type == 'tag' || inputs.release_tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: PokopiaRecomp-*
          path: build/assets
          merge-multiple: true

      - name: Checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd build/assets
          ls -la
          rm -f SHA256SUMS.txt
          # whatever the platform jobs produced: a job that failed leaves its archive out instead of failing this one
          sha256sum -b ./*.zip ./*.tar.gz ./*.dmg 2>/dev/null | sed -E 's#\./##' > SHA256SUMS.txt || true
          cat SHA256SUMS.txt
          test -s SHA256SUMS.txt || { echo "::error::no release archives were built"; exit 1; }
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" SHA256SUMS.txt --clobber

